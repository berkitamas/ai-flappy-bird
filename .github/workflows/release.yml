name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            ext: .exe
            goos: windows
            goarch: amd64
          - os: macos
            ext: ''
            goos: darwin
            goarch: amd64
          - os: linux
            ext: ''
            goos: linux
            goarch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libasound2-dev

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go mod tidy
          go build -v -o ai-flappy-bird${{ matrix.ext }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-flappy-bird-${{ matrix.os }}
          path: ai-flappy-bird${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release directory
        run: mkdir release

      - name: Prepare release files
        run: |
          cp artifacts/ai-flappy-bird-windows/ai-flappy-bird.exe release/ai-flappy-bird-windows-amd64.exe
          cp artifacts/ai-flappy-bird-macos/ai-flappy-bird release/ai-flappy-bird-macos-amd64
          cp artifacts/ai-flappy-bird-linux/ai-flappy-bird release/ai-flappy-bird-linux-amd64
          cp README.md LICENSE release/
          cd release && zip -r ai-flappy-bird-windows-amd64.zip ai-flappy-bird-windows-amd64.exe README.md LICENSE
          cd release && zip -r ai-flappy-bird-macos-amd64.zip ai-flappy-bird-macos-amd64 README.md LICENSE
          cd release && zip -r ai-flappy-bird-linux-amd64.zip ai-flappy-bird-linux-amd64 README.md LICENSE

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/ai-flappy-bird-windows-amd64.zip
            release/ai-flappy-bird-macos-amd64.zip
            release/ai-flappy-bird-linux-amd64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
